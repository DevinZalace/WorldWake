[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldwake"
version = "0.1.0"
description = "A living fantasy world generator and simulation engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]