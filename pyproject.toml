[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldwake"
version = "0.1.0"
description = "A living fantasy world generator and simulation engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pillow>=11.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.18,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
